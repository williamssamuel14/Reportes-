<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><meta name="theme-color" content="#0b5fff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Reportes">
<title>Reportes Planta Externa</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fa;--card:#fff;--tx:#14202e;--mu:#5d6b7c;--ac:#0b5fff;--ac2:#e6eeff;--bd:#d6dde8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1620;--card:#18222f;--tx:#e8eef6;--mu:#93a1b3;--ac:#5b93ff;--ac2:#1d2c45;--bd:#2a3748}}
:root[data-theme="dark"]{--bg:#0f1620;--card:#18222f;--tx:#e8eef6;--mu:#93a1b3;--ac:#5b93ff;--ac2:#1d2c45;--bd:#2a3748}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:19px;margin:6px 0 14px}p.s{color:var(--mu);margin:0 0 16px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:0 0 10px;color:var(--tx);font:inherit;cursor:pointer}
.card b{display:block;font-size:17px}.card span{color:var(--mu);font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:130px;resize:vertical}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:600 16px inherit;margin-top:16px;cursor:pointer}
.btn.g{background:var(--ac2);color:var(--ac)}.btn.sm{display:inline-block;width:auto;padding:10px 14px;margin:8px 8px 0 0;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
.back{background:none;border:0;color:var(--ac);font:600 15px inherit;padding:6px 0;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin-top:10px}.chk input{width:auto}
.pill{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.pill button{background:none;border:0;color:#d33;font-size:15px;cursor:pointer}
.out{white-space:pre-wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;font-size:15px}
.ok{color:#1a9b4b;font-weight:600;min-height:22px;margin-top:8px}.ok.err{color:#d33}.rc{margin-bottom:10px}.rb{padding:10px 2px 2px}
</style></head><body><main id="app"></main>
<script>
var $=function(s){return document.querySelector(s)};
var techs=[],v={},cur=null;
try{techs=JSON.parse(localStorage.getItem("techs")||"[]")}catch(e){}
var ADMIN=false,PIN="",VIEW="home";
try{PIN=localStorage.getItem("pin")||""}catch(e){}
function api(body,pin){return fetch("/api/tecnicos",{method:"POST",headers:{"Content-Type":"application/json","x-admin-pin":pin},body:JSON.stringify(body)})}
function saveT(){
  try{localStorage.setItem("techs",JSON.stringify(techs))}catch(e){}
  if(ADMIN){api({list:techs},PIN).then(function(r){if(!r.ok)alert("No se pudo guardar. Revisa el PIN o la conexión.")}).catch(function(){alert("No se pudo guardar. Revisa la conexión.")})}
}
function refreshView(){if(VIEW==="home")home();else if(VIEW==="techs")techView()}
async function initShared(){
  try{
    var r=await fetch("/api/tecnicos",{cache:"no-store"});
    if(r.ok){var d=await r.json();if(Array.isArray(d.list)){techs=d.list;try{localStorage.setItem("techs",JSON.stringify(techs))}catch(e){}}}
  }catch(e){}
  if(PIN){
    try{var c=await api({verificar:true},PIN);ADMIN=c.ok;if(!c.ok){PIN="";try{localStorage.removeItem("pin")}catch(e){}}}catch(e){}
  }
  refreshView();
}
async function loginAdmin(){
  var p=prompt("PIN de administrador");if(!p)return;
  try{
    var c=await api({verificar:true},p);
    if(c.ok){PIN=p;ADMIN=true;try{localStorage.setItem("pin",p)}catch(e){}techView()}else alert("PIN incorrecto");
  }catch(e){alert("Sin conexión")}
}
function logoutAdmin(){PIN="";ADMIN=false;try{localStorage.removeItem("pin")}catch(e){}techView()}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function polish(t){
  return t.split(/\n+/).map(function(p){
    p=p.trim().replace(/[ \t]+/g," ");if(!p)return"";
    p=p.replace(/\b(tambien|despues|ademas|validacion|conexion|revision|ubicacion|instalacion|atenuacion|señal|posicion|solucion|informacion|operacion|direccion)\b/gi,function(w){var m={tambien:"también",despues:"después",ademas:"además",validacion:"validación",conexion:"conexión",revision:"revisión",ubicacion:"ubicación",instalacion:"instalación",atenuacion:"atenuación",posicion:"posición",solucion:"solución",informacion:"información",operacion:"operación",direccion:"dirección"};var r=m[w.toLowerCase()]||w;return w[0]===w[0].toUpperCase()&&w[0]!==w[0].toLowerCase()?r[0].toUpperCase()+r.slice(1):r});
    p=p.replace(/(^|[.!?]\s+)([a-záéíóúñ])/g,function(m,a,b){return a+b.toUpperCase()});
    return /[.!?]$/.test(p)?p:p+".";
  }).filter(Boolean).join("\n\n");
}
function com(){return v.imp!=null?v.imp:(v.pol?polish(v.com||""):(v.com||"").trim())}
function hoy(){var d=new Date(),p=function(n){return(n<10?"0":"")+n};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function fmtF(s){var a=(s||"").split("-");return a.length===3?a[2]+"/"+a[1]+"/"+a[0]:""}
function tt(){var a=[v.t1,v.t2];for(var i=0;i<(v.n||0);i++)a.push(v["x"+i]);return a.filter(Boolean).join(" / ")}

var FTIPO="ruido";
function ft(){return FTIPO==="cronico"?"Se filtra cliente crónico":"Se filtran cliente por ruido"}
var F={
 resumen:{t:"Resumen diario",d:"Mantenimiento HFC",f:["paste","num","nodo","fecha","tech","com"],lbl:{num:"Nº de mantenimiento"},
  b:function(){return "Resumen diario – Mantenimiento HFC\n\n* Fecha: "+fmtF(v.fecha)+"\n* Mantenimiento: "+(v.num||"")+"\n* Nodo: "+(v.nodo||"")+"\n* Técnicos: "+tt()+"\n\nComentario técnico:\n\n"+com()}},
 falla:{t:"Falla / reporte",d:"Reporte de falla",f:["paste","num","nodo","tech","com"],lbl:{num:"Número de falla"},
  b:function(){return "Falla: "+(v.num||"")+"\nNodo: "+(v.nodo||"")+"\nTécnicos: "+tt()+"\n\nComentarios: "+com()}},
 calle:{t:"Filtrado de cliente · Calle",d:"Tap en poste",f:["nodo","tag","tap","poste","amp","gps"],
  b:function(){return ft()+"\nNodo: "+(v.nodo||"")+"\nTag id: "+(v.tag||"")+"\nTap: "+(v.tap||"")+"\nPoste: "+(v.poste||"")+"\nAmp: "+(v.amp||"")+" Coordenadas: "+(v.coord||"")}},
 edificio:{t:"Filtrado de cliente · Edificio",d:"Tap en piso",f:["nodo","tag","tap","piso","amp","coord"],
  b:function(){return ft()+"\nNodo: "+(v.nodo||"")+"\nTag id: "+(v.tag||"")+"\nTap: "+(v.tap||"")+"\nPiso: "+(v.piso||"")+"\nAmp: "+(v.amp||"")+" Coordenadas: "+(v.coord||"")}}
};
var L={nodo:"Nodo",tag:"Tag id",tap:"Tap (ej. 20x4)",poste:"Poste (S/n si no tiene)",piso:"Piso",amp:"Amp",coord:"Coordenadas",num:"Número"};

function home(){
  cur=null;VIEW="home";
  var h='<h1>Reportes Planta Externa</h1><p class="s">¿Qué formulario vas a llenar?'+(ADMIN?' · <b>Modo administrador</b>':'')+'</p>';
  ["resumen","falla"].forEach(function(k){h+='<button class="card" data-go="'+k+'"><b>'+F[k].t+'</b><span>'+F[k].d+'</span></button>'});
  h+='<button class="card" data-go="filtrado"><b>Filtrado de cliente</b><span>En calle o en edificio</span></button>';
  h+='<button class="card" data-go="nodos"><b>Nodos</b><span>Reportes y planos de cada nodo</span></button>';
  h+='<button class="card" data-go="techs"><b>Técnicos</b><span>'+(techs.length?techs.length+" guardados":(ADMIN?"Agrega los nombres de tus compañeros":"El administrador aún no agrega técnicos"))+'</span></button>';
  $("#app").innerHTML=h;
  document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){var k=b.dataset.go;k==="techs"?techView():k==="nodos"?nodosView():k==="filtrado"?filtroView():form(k)}});
}

function filtroView(){
  cur=null;VIEW="filtro";
  $("#app").innerHTML='<button class="back" id="bk">← Inicio</button><h2>Filtrado de cliente</h2><label style="margin-top:0">Tipo de filtrado</label><div class="row"><button class="btn'+(FTIPO==="ruido"?"":" g")+'" data-m="ruido" style="margin:0">Por ruido</button><button class="btn'+(FTIPO==="cronico"?"":" g")+'" data-m="cronico" style="margin:0">Cliente crónico</button></div><p class="s" style="margin-top:18px">¿Dónde se hizo el filtrado?</p><button class="card" data-f="calle"><b>En calle</b><span>Tap en poste</span></button><button class="card" data-f="edificio"><b>En edificio</b><span>Tap en piso</span></button>';
  $("#bk").onclick=home;
  document.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){FTIPO=b.dataset.m;filtroView()}});
  document.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){form(b.dataset.f)}});
}

function techView(){
  VIEW="techs";
  var h='<button class="back" id="bk">← Inicio</button><h2>Técnicos</h2>';
  techs.forEach(function(n,i){h+='<div class="pill"><span>'+esc(n)+'</span>'+(ADMIN?'<button data-d="'+i+'">Quitar</button>':'')+'</div>'});
  if(!techs.length)h+='<p class="s">Aún no hay nombres guardados.</p>';
  h+=ADMIN?'<label>Nuevo técnico</label><input id="nt" placeholder="Nombre y apellido"><button class="btn" id="ad">Agregar</button><button class="btn g" id="lo">Cerrar sesión de administrador</button>':'<p class="s">Solo el administrador puede agregar o quitar técnicos.</p><button class="btn g" id="lg">Entrar como administrador</button>';
  $("#app").innerHTML=h;
  $("#bk").onclick=home;
  if($("#lg"))$("#lg").onclick=loginAdmin;if($("#lo"))$("#lo").onclick=logoutAdmin;if($("#ad"))$("#ad").onclick=function(){var n=$("#nt").value.trim();if(n&&techs.indexOf(n)<0){techs.push(n);saveT()}techView()};
  document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){techs.splice(+b.dataset.d,1);saveT();techView()}});
}

function form(k,keep){
  cur=k;VIEW="form";
  if(!keep){var t1=v.t1,t2=v.t2;v={pol:true,t1:t1,t2:t2,fecha:hoy()}}
  var d=F[k],h='<button class="back" id="bk">← Inicio</button><h2>'+d.t+((k==="calle"||k==="edificio")?" · "+(FTIPO==="cronico"?"Cliente crónico":"Ruido"):"")+'</h2>';
  d.f.forEach(function(f){
    if(f==="paste")h+='<label>Pega aquí el mensaje de la orden</label><textarea id="paste" placeholder="Pega el mensaje completo de la orden o falla">'+esc(v.paste)+'</textarea><p class="s" style="margin:4px 0 0;font-size:13px">Con captura: copia el texto de la imagen con tu celular y pégalo aquí.</p>';
    else if(f==="tech"){
      if(!techs.length)h+='<label>Técnicos</label><p class="s">Primero agrega técnicos en la sección “Técnicos”.</p>';
      else{h+='<div class="row"><div><label>Técnico 1</label>'+sel("t1")+'</div><div><label>Técnico 2</label>'+sel("t2")+'</div></div>';
      for(var i=0;i<(v.n||0);i++)h+='<div class="row" style="align-items:flex-end"><div><label>Técnico '+(i+3)+'</label>'+sel("x"+i)+'</div><button class="btn g sm" data-rm="'+i+'" style="flex:0 0 52px;margin:0" aria-label="Quitar técnico">✕</button></div>';
      if((v.n||0)<4)h+='<button class="btn g sm" id="addt">+ Agregar técnico</button>'}
    }
    else if(f==="fecha")h+='<label>Fecha del resumen</label><input type="date" data-k="fecha" value="'+esc(v.fecha)+'">';
    else if(f==="com")h+='<label>Comentario técnico</label><textarea data-k="com" placeholder="Escribe lo que se hizo, como lo dirías normalmente">'+esc(v.com)+'</textarea><label class="chk"><input type="checkbox" id="pol" '+(v.pol?"checked":"")+'> Ordenar texto (mayúsculas, puntos y acentos comunes)</label>';
    else if(f==="gps")h+='<label>Coordenadas</label><input data-k="coord" value="'+esc(v.coord)+'" placeholder="(9.0054963, -79.5176288)"><button class="btn g sm" id="gps">📍 Usar mi ubicación actual</button><div class="ok" id="gm"></div>';
    else h+='<label>'+((d.lbl&&d.lbl[f])||L[f])+'</label><input data-k="'+f+'" value="'+esc(v[f])+'">';
  });
  h+='<button class="btn" id="go">Generar reporte</button>';
  $("#app").innerHTML=h;
  $("#bk").onclick=(k==="calle"||k==="edificio")?filtroView:home;
  document.querySelectorAll("[data-k]").forEach(function(e){e.oninput=function(){v[e.dataset.k]=e.value}});
  document.querySelectorAll("select[data-t]").forEach(function(e){e.onchange=function(){v[e.dataset.t]=e.value}});
  if($("#addt"))$("#addt").onclick=function(){v.n=(v.n||0)+1;form(cur,true)};
  document.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){var i=+b.dataset.rm,n=v.n||0;for(var j=i;j<n-1;j++)v["x"+j]=v["x"+(j+1)];delete v["x"+(n-1)];v.n=n-1;form(cur,true)}});
  if($("#pol"))$("#pol").onchange=function(){v.pol=this.checked};
  if($("#paste"))$("#paste").oninput=function(){v.paste=this.value;
    var s=this.value,n=s.match(/\b[A-Z]{2}-\d{3}-\d{2}\b/),m=s.match(/No\.?\s*(\d{5,})/i)||s.match(/(?:falla|reporte|ticket|caso)\s*(?:n[úu]mero|no\.?|#)?\s*[:#]?\s*([A-Z0-9]*\d[A-Z0-9]*)/i)||s.match(/\b([A-Z]\d{4,6}[A-Z])\b/);
    if(n){v.nodo=n[0];document.querySelector('[data-k="nodo"]').value=n[0]}
    if(m){v.num=m[1];document.querySelector('[data-k="num"]').value=m[1]}
  };
  if($("#gps"))$("#gps").onclick=function(){
    var g=$("#gm");g.textContent="Buscando ubicación…";
    if(!navigator.geolocation){g.textContent="Tu navegador no permite ubicación.";return}
    navigator.geolocation.getCurrentPosition(function(p){
      v.coord="("+p.coords.latitude.toFixed(7)+", "+p.coords.longitude.toFixed(7)+")";
      document.querySelector('[data-k="coord"]').value=v.coord;g.textContent="Ubicación agregada";
    },function(){g.textContent="No se pudo obtener. Activa el permiso de ubicación o escríbela."},{enableHighAccuracy:true,timeout:15000});
  };
  $("#go").onclick=result;
}
function sel(k){
  var o='<option value="">Elegir…</option>';
  techs.forEach(function(n){o+='<option'+(v[k]===n?" selected":"")+'>'+esc(n)+'</option>'});
  return '<select data-t="'+k+'">'+o+'</select>';
}

function result(){v.imp=null;show()}
function show(){
  var txt=F[cur].b();
  $("#app").innerHTML='<h2>Reporte listo</h2><div class="out" id="ot">'+esc(txt)+'</div><div class="ok" id="sv"></div><button class="btn" id="cp">Copiar reporte</button><div class="ok" id="ok"></div><button class="btn g" id="ed">Editar</button><button class="btn g" id="nw">Hacer otro formulario</button>';
  $("#cp").onclick=function(){
    var done=function(){$("#ok").textContent="Copiado ✓"};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fb);else fb();
    function fb(){var r=document.createRange();r.selectNodeContents($("#ot"));var s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand("copy");done()}catch(e){$("#ok").textContent="Mantén presionado el texto para copiar"}}
  };
  $("#ed").onclick=function(){form(cur,true)};
  $("#nw").onclick=home;
  var sv=$("#sv");
  function intenta(){
    sv.className="ok";sv.textContent="Guardando en el nodo…";
    guardaRep().then(function(r){
      sv.className=r.ok?"ok":"ok err";sv.textContent=r.msg;
      if(!r.ok){var b=document.createElement("button");b.className="back";b.textContent=" Reintentar";b.onclick=intenta;sv.appendChild(b)}
    });
  }
  intenta();
}

/* ===== NODOS ===== */
var TIPO={resumen:"Resumen diario",falla:"Falla",calle:"Filtrado · Calle",edificio:"Filtrado · Edificio"};
var NOD=[],NSEL="",NREP=[],NPL=null,FQ="",FD="";
function nz(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function normN(s){return String(s||"").trim().toUpperCase().replace(/\s+/g,"")}
function okN(s){return /^[A-Z0-9][A-Z0-9-]{2,19}$/.test(s)}
function jn(url,opt){return fetch(url,opt).then(function(r){return r.json().catch(function(){return{}}).then(function(d){return{ok:r.ok,d:d}})})}
function nPost(body){return fetch("/api/nodos",{method:"POST",headers:{"Content-Type":"application/json","x-admin-pin":ADMIN?PIN:""},body:JSON.stringify(body)})}
function copiar(txt,cb){
  function fb(){var t=document.createElement("textarea");t.value=txt;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");cb(true)}catch(e){cb(false)}document.body.removeChild(t)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){cb(true)},fb);else fb();
}
function guardaRep(){
  var n=normN(v.nodo);
  if(!okN(n))return Promise.resolve({ok:false,msg:"No se guardó en Nodos: falta el nodo."});
  if(!v.rid)v.rid=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  var rep={id:v.rid,tipo:cur,fecha:(cur==="resumen"&&v.fecha)?v.fecha:hoy(),nodo:n,texto:F[cur].b(),tecnicos:tt(),num:v.num||v.tag||""};
  var prev=(v.rnodo&&v.rnodo!==n)?v.rnodo:"";
  return nPost({accion:"reporte",nodo:n,anterior:prev,reporte:rep}).then(function(r){
    if(r.ok){v.rnodo=n;return{ok:true,msg:"Guardado en el nodo "+n+" ✓"}}
    return{ok:false,msg:"No se pudo guardar en Nodos."};
  }).catch(function(){return{ok:false,msg:"Sin conexión: no se guardó en Nodos."}});
}

function nodosView(){
  VIEW="nodos";cur=null;
  $("#app").innerHTML='<button class="back" id="bk">← Inicio</button><h2>Nodos</h2><input id="nq" placeholder="Buscar nodo…"><div class="row" style="margin-top:8px"><input id="nn" placeholder="Nuevo nodo (ej. SC-005-01)"><button class="btn g sm" id="na" style="flex:0 0 auto;margin:0">+ Agregar</button></div><div id="nl" style="margin-top:14px"><p class="s">Cargando…</p></div>';
  $("#bk").onclick=home;
  $("#nq").oninput=pintaN;
  $("#na").onclick=function(){
    var n=normN($("#nn").value);
    if(!okN(n)){alert("Escribe un nodo válido, por ejemplo SC-005-01");return}
    nPost({accion:"nodo",nodo:n}).then(function(r){if(r.ok)nodoView(n);else alert("No se pudo agregar el nodo.")}).catch(function(){alert("Sin conexión")});
  };
  jn("/api/nodos").then(function(r){if(!r.ok)throw 0;NOD=r.d.nodos||[];pintaN()}).catch(function(){$("#nl").innerHTML='<p class="s">No se pudo cargar. Revisa la conexión.</p>'});
}
function pintaN(){
  var q=nz($("#nq").value),h="";
  NOD.filter(function(x){return nz(x.nodo).indexOf(q)>=0}).forEach(function(x){
    h+='<button class="card" data-n="'+esc(x.nodo)+'"><b>'+esc(x.nodo)+'</b><span>'+x.reportes+(x.reportes===1?" reporte":" reportes")+' · '+(x.plano?"Con plano":"Sin plano")+'</span></button>';
  });
  if(!h)h='<p class="s">'+(NOD.length?"No hay nodos con ese nombre.":"Aún no hay nodos. Se registran solos al generar reportes, o agrégalos arriba.")+'</p>';
  $("#nl").innerHTML=h;
  document.querySelectorAll("[data-n]").forEach(function(b){b.onclick=function(){nodoView(b.dataset.n)}});
}

function nodoView(n){
  VIEW="nodo";NSEL=n;FQ="";FD="";NREP=[];NPL=null;
  $("#app").innerHTML='<button class="back" id="bk">← Nodos</button><h2>'+esc(n)+'</h2><div id="pl"><p class="s">Cargando…</p></div><h2 style="margin-top:22px">Reportes</h2><div id="fl"></div><div id="rl" style="margin-top:12px"></div>';
  $("#bk").onclick=nodosView;
  jn("/api/nodos?nodo="+encodeURIComponent(n)).then(function(r){
    if(!r.ok)throw 0;
    NREP=r.d.reportes||[];NPL=r.d.plano||null;
    pintaPlano();pintaFiltros();pintaReps();
  }).catch(function(){$("#pl").innerHTML='<p class="s">No se pudo cargar. Revisa la conexión.</p>'});
}

function pintaPlano(){
  var h='<label style="margin-top:0">Plano</label>';
  if(NPL){
    var u="/api/plano?nodo="+encodeURIComponent(NSEL)+"&v="+encodeURIComponent(NPL.fecha||"");
    if(/^image\//.test(NPL.tipo))h+='<a href="'+u+'" target="_blank"><img src="'+u+'" alt="Plano" style="width:100%;border:1px solid var(--bd);border-radius:12px;background:#fff"></a>';
    var cad=!(/^image\//.test(NPL.tipo)||NPL.tipo==="application/pdf");
    h+='<div class="pill" style="margin-top:6px"><span>📐 '+esc(NPL.nombre||"Plano")+'</span></div>';
    if(cad)h+='<p class="s" style="margin:0;font-size:13px">Archivo de AutoCAD. Se descarga para abrirlo con AutoCAD o DWG TrueView.</p>';
    h+='<a class="btn g sm" href="'+u+'" target="_blank" style="text-decoration:none">'+(cad?"Descargar plano":"Abrir plano")+'</a>';
    if(ADMIN)h+='<button class="btn g sm" id="pr">Reemplazar</button><button class="btn g sm" id="pd">Eliminar</button>';
  }else h+='<p class="s">Este nodo aún no tiene plano. Puedes subir un DWG, DXF, PDF o imagen.</p><button class="btn sm" id="pa" style="margin-top:0">Agregar plano</button>';
  h+='<input type="file" id="pf" hidden><div class="ok" id="pm"></div>';
  $("#pl").innerHTML=h;
  if($("#pa"))$("#pa").onclick=function(){$("#pf").click()};
  if($("#pr"))$("#pr").onclick=function(){$("#pf").click()};
  $("#pf").onchange=function(){var f=this.files[0];this.value="";if(f)subePlano(f)};
  if($("#pd"))$("#pd").onclick=function(){
    if(!confirm("¿Eliminar el plano de este nodo?"))return;
    fetch("/api/plano?nodo="+encodeURIComponent(NSEL),{method:"DELETE",headers:{"x-admin-pin":PIN}}).then(function(r){if(r.ok){NPL=null;pintaPlano()}else alert("No se pudo eliminar.")}).catch(function(){alert("Sin conexión")});
  };
}
function comprime(f){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(f),i=new Image();
    i.onload=function(){
      var k=Math.min(1,2400/Math.max(i.width,i.height)),c=document.createElement("canvas");
      c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
      var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(function(b){b?res(b):rej()},"image/jpeg",0.85);
    };
    i.onerror=function(){rej()};
    i.src=u;
  });
}
async function subePlano(f){
  var m=$("#pm");m.className="ok";m.textContent="Preparando archivo…";
  try{
    var b=f,ext=((f.name||"").split(".").pop()||"").toLowerCase(),ct=f.type;
    if(/^image\//.test(f.type)){b=await comprime(f);ct="image/jpeg"}
    else if(f.type==="application/pdf"||ext==="pdf")ct="application/pdf";
    else if(ext==="dwg"||ext==="dxf")ct="application/octet-stream";
    else{m.className="ok err";m.textContent="Usa un archivo DWG, DXF, PDF o una imagen.";return}
    if(b.size>5000000){m.className="ok err";m.textContent="El archivo pesa más de 5 MB. Usa uno más liviano.";return}
    m.textContent="Subiendo…";
    var r=await fetch("/api/plano?nodo="+encodeURIComponent(NSEL),{method:"POST",headers:{"Content-Type":ct,"x-nombre":encodeURIComponent(f.name||"plano"),"x-admin-pin":ADMIN?PIN:""},body:b});
    if(!r.ok){var d={};try{d=await r.json()}catch(e){}m.className="ok err";m.textContent=d.error||"No se pudo subir.";return}
    nodoView(NSEL);
  }catch(e){m.className="ok err";m.textContent="No se pudo subir. Revisa la conexión o prueba con otro archivo."}
}

function pintaFiltros(){
  $("#fl").innerHTML='<input id="fq" placeholder="Buscar: palabra, número, técnico…"><label>Buscar por fecha</label><div class="row"><input type="date" id="fd"><button class="btn g sm" id="fx" style="flex:0 0 auto;margin:0">Limpiar</button></div>';
  $("#fq").oninput=function(){FQ=this.value;pintaReps()};
  $("#fd").onchange=function(){FD=this.value;pintaReps()};
  $("#fx").onclick=function(){FQ="";FD="";$("#fq").value="";$("#fd").value="";pintaReps()};
}
function pintaReps(){
  var q=nz(FQ);
  var l=NREP.filter(function(r){return(!FD||r.fecha===FD)&&(!q||nz(r.texto+" "+r.tecnicos+" "+r.num).indexOf(q)>=0)}).sort(function(a,b){return(b.fecha+(b.creado||"")).localeCompare(a.fecha+(a.creado||""))});
  var h="";
  l.forEach(function(r,i){
    var pv=[r.num,r.tecnicos].filter(Boolean).join(" · ")||"Ver reporte";
    h+='<div class="rc"><button class="card" style="margin:0" data-r="'+i+'"><b>'+(TIPO[r.tipo]||"Reporte")+' · '+fmtF(r.fecha)+'</b><span>'+esc(pv)+'</span></button><div class="rb" id="rb'+i+'" hidden></div></div>';
  });
  if(!h)h='<p class="s">'+(NREP.length?"Ningún reporte coincide con la búsqueda.":"Este nodo aún no tiene reportes.")+'</p>';
  else h='<p class="s" style="margin-bottom:10px">'+l.length+(l.length===1?" reporte":" reportes")+'</p>'+h;
  $("#rl").innerHTML=h;
  document.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){
    var r=l[+b.dataset.r],box=$("#rb"+b.dataset.r);
    if(!box.hidden){box.hidden=true;return}
    box.innerHTML='<div class="out">'+esc(r.texto)+'</div><button class="btn sm" data-cp>Copiar</button>'+(ADMIN?'<button class="btn g sm" data-del>Eliminar</button>':'')+'<span class="ok" style="margin-left:6px"></span>';
    box.hidden=false;
    box.querySelector("[data-cp]").onclick=function(){copiar(r.texto,function(o){box.querySelector(".ok").textContent=o?"Copiado ✓":"No se pudo copiar"})};
    var d=box.querySelector("[data-del]");
    if(d)d.onclick=function(){
      if(!confirm("¿Eliminar este reporte?"))return;
      nPost({accion:"borrar_reporte",nodo:NSEL,id:r.id}).then(function(x){
        if(x.ok){NREP=NREP.filter(function(y){return y.id!==r.id});pintaReps()}else alert("No se pudo eliminar. Revisa tu sesión de administrador.");
      }).catch(function(){alert("Sin conexión")});
    };
  }});
}

home();
initShared();
</script></body></html>
